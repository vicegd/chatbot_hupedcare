# ============================================================================
# AI section
# ----------------------------------------------------------------------------
# This block controls all language-model features used by the project:
# - Text generation for user answers
# - Audio transcription
# - Image understanding
# ============================================================================
ai:
  # Base URL of the model provider API. Keep `/v1` for OpenAI-compatible clients.
  base_url: "https://api.openai.com/v1"

  # Main chat model used to generate final answers in the API server.
  model: "gpt-4o-mini-2024-07-18"

  # Core behavior policy injected as the system message for every answer.
  # This prompt enforces retrieval-first behavior and source attribution.
  system_prompt: "You are an expert research assistant. Answer ONLY using the provided RETRIEVED CONTEXT.
    IDENTITY RULE:
    - If the user asks who you are, you MUST respond that you are the 'HUPEDCARE Assistant', specialized in the HUPEDCARE platform and pediatric pain management.
    CRITICAL PRIORITY RULES:
    1. DATABASE RECORDS: Information starting with '[DB | ...]' represents structured database truth. Give it the HIGHEST priority if there is conflicting information.
    2. OFFICIAL SOURCES: Information enclosed in '--- SOURCE: ... ---' represents verified documents or exact visual descriptions. Always trust and prioritize this data.
    3. If the user asks about a general concept (like 'boat' or 'ship'), actively look for specific matches in the visual descriptions (like 'ferry').
    FORMATTING RULES:
    - Whenever you answer, briefly mention the SOURCE you used. For example: (source: nombre_documento.doc) or (source: nombre_imagen.jpg) or (source: data base). Translate the word 'source' to the language of the user's question if necessary.
     ANSWERING RULES:
     - Always prioritize information from the RETRIEVED CONTEXT. Do NOT use any other knowledge or make assumptions.
    - If the RETRIEVED CONTEXT does not contain relevant information to answer the user's question, you MUST say 'I don't have that information' and NOT attempt to answer.
    - If the requested information is not in the context, explicitly say you don't have that data. Do not guess.
    - Always answer in the exact language the user used to ask the question.
    - If the user asks for a list, provide a concise bullet-point list based on the retrieved context.
    - If the user asks for a summary, provide a brief summary based on the retrieved context.
    - If the user asks for a definition, provide a clear and concise definition based on the retrieved context.
    - If the user asks for a comparison, provide a clear and concise comparison based on the retrieved context.
    - If the user asks for a recommendation, provide a clear and concise recommendation based on the retrieved context.
    - If the user asks for a step-by-step guide, provide a clear and concise guide based on the retrieved context.
    - If the user asks for an explanation, provide a clear and concise explanation based on the retrieved context.
    - If the user asks for an example, provide a clear and concise example based on the retrieved context.
    - If the user asks for a translation, provide a clear and concise translation based on the retrieved context.
    "

  # Speech-to-text model used when processing audio files in ingestion.
  transcription_model: "whisper-1"

  # Vision-capable model used to describe images for RAG indexing.
  vision_model: "gpt-4o-mini-2024-07-18"


# ============================================================================
# Embeddings and retrieval section
# ----------------------------------------------------------------------------
# These values tune how documents are chunked, indexed, and retrieved for RAG.
# ============================================================================
embeddings:
  # Embedding model used by ChromaDB to convert text chunks to vectors.
  embedding_model: "text-embedding-3-small"

  # Number of nearest chunks retrieved per question.
  # Higher values increase context breadth but can add noise.
  top_k: 6

  # Sampling temperature for final answer generation.
  # Low values favor deterministic, factual responses.
  temperature: 0.2

  # Maximum size of each text chunk before embedding.
  # Larger chunks keep more context but may reduce retrieval precision.
  max_chunk_size: 1100

  # Number of overlapping characters between adjacent chunks.
  # Overlap helps preserve continuity across chunk boundaries.
  chunk_overlap: 200


# ============================================================================
# Logging section
# ----------------------------------------------------------------------------
# Defines where logs are written, how verbose they are, and rotation policy.
# ============================================================================
logger:
  # Folder where log files are stored.
  log_folder: "logs"

  # Console verbosity level (seen during local runs).
  log_console_level: "INFO"

  # File verbosity level (usually more detailed than console).
  log_file_level: "DEBUG"

  # Format string for console log lines.
  log_console_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Format string for file log lines.
  log_file_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Maximum size in bytes for a single log file before rotation.
  # 5,242,880 bytes = 5 MB.
  log_max_bytes: 5242880

  # Number of rotated backup files kept on disk.
  log_backup_count: 3


# ============================================================================
# Storage section
# ----------------------------------------------------------------------------
# Base folder for runtime data generated by ingestion and vector indexing.
# ============================================================================
storage:
  # Root data folder used by the pipeline.
  data_folder: "data"


# ============================================================================
# Server section
# ----------------------------------------------------------------------------
# API host settings and CORS policy for browser-based clients.
# ============================================================================
server:
  host: "0.0.0.0"
  port: 8000
  # External client-facing API base URLs (without /ask).
  # Use this list when you need multiple addresses (LAN, public IP, reverse proxy, etc.).
  public_urls:
    - "http://127.0.0.1:8000"
    - "http://156.35.98.76:8000"

  # Explicit CORS allowlist for production frontend origins.
  allowed_origins:
    - "https://project.hupedcare.com"
    - "https://hupedcare.com"

  # Extra CORS pattern for local development (localhost + file/null origin).
  allow_origin_regex: "^(http://127\\.0\\.0\\.1(:[0-9]+)?|null)$"


# ============================================================================
# Database section
# ----------------------------------------------------------------------------
# SQL queries that enrich the RAG corpus with structured WordPress content.
# Each query should return relevant text fields for downstream normalization.
# ============================================================================
database:
  queries:
    # Query 1: Published posts/pages only.
    # Excludes drafts, revisions, and menu items to avoid noisy content.
    - "SELECT post_title, post_content, post_type, post_date FROM wp_posts WHERE post_status = 'publish' AND post_type IN ('post', 'page')"

    # Query 2: Approved user comments.
    # Excludes pingbacks/trackbacks/spam to keep user-generated data relevant.
    - "SELECT comment_author, comment_content, comment_date FROM wp_comments WHERE comment_approved = '1' AND comment_type IN ('comment', '')"

    # Query 3: Platform users/authors.
    # Adds authority context so the assistant can reference official contributors.
    - "SELECT display_name, user_email, user_registered FROM wp_users"

    # Query 4: Taxonomy metadata (categories/tags) with at least one linked post.
    # Helps retrieval understand site structure and topic hierarchy.
    - "SELECT t.name AS term_name, tt.taxonomy, tt.description FROM wp_terms t INNER JOIN wp_term_taxonomy tt ON t.term_id = tt.term_id WHERE tt.count > 0"