# Configuración del Motor de IA
ai:
  base_url: "https://api.groq.com/openai/v1"
  model: "llama-3.3-70b-versatile"
  system_prompt: "Eres un asistente experto. Usa el contexto para responder. Responde en el idioma del usuario."
  transcription_model: "whisper-large-v3"
  vision_model: "meta-llama/llama-4-scout-17b-16e-instruct"
  
# Configuración del Sistema de Archivos
storage:
  data_folder: "DATA"
  refresh_interval_seconds: 3600

# Configuración del Servidor
server:
  host: "127.0.0.1"
  port: 8000

database:
  queries:
    - "SELECT * FROM productos LIMIT 50"
    - "SELECT * FROM logs_recientes ORDER BY fecha DESC LIMIT 20"